name: Deploy Trufo with Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '*.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
        - prod
        - staging
        - dev

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-TerraformDeployment
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    - name: Terraform Validate
      run: |
        cd terraform
        terraform validate

    - name: Terraform Plan
      run: |
        cd terraform
        terraform plan \
          -var="from_email=${{ vars.FROM_EMAIL }}" \
          -var="ses_domain=${{ vars.SES_DOMAIN || '' }}" \
          -var="domain_name=${{ vars.DOMAIN_NAME || '' }}" \
          -var="hosted_zone_id=${{ vars.HOSTED_ZONE_ID || '' }}" \
          -var="github_org=${{ github.repository_owner }}" \
          -var="github_repo=${{ github.event.repository.name }}" \
          -var="environment=${{ github.event.inputs.environment || 'prod' }}" \
          -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Get Terraform Outputs
      id: terraform-outputs
      run: |
        cd terraform
        echo "function-url=$(terraform output -raw function_url)" >> $GITHUB_OUTPUT
        echo "website-url=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT
        echo "bucket-name=$(terraform output -raw bucket_name)" >> $GITHUB_OUTPUT

    - name: Create deployment summary
      run: |
        echo "## 🚀 Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ github.event.inputs.environment || 'prod' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
        echo "**S3 Bucket:** ${{ steps.terraform-outputs.outputs.bucket-name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 Access URLs" >> $GITHUB_STEP_SUMMARY
        echo "- **Website:** ${{ steps.terraform-outputs.outputs.website-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Function URL:** ${{ steps.terraform-outputs.outputs.function-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Create Page:** ${{ steps.terraform-outputs.outputs.website-url }}create" >> $GITHUB_STEP_SUMMARY
        echo "- **Manage Page:** ${{ steps.terraform-outputs.outputs.website-url }}manage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📧 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Verify your email in SES: \`aws ses verify-email-identity --email-address ${{ vars.FROM_EMAIL }}\`" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ vars.SES_DOMAIN }}" != "" ]]; then
          echo "2. Add SES domain verification DNS record (check Terraform outputs)" >> $GITHUB_STEP_SUMMARY
          echo "3. Test the application at the website URL above" >> $GITHUB_STEP_SUMMARY
          echo "4. Request SES production access if needed" >> $GITHUB_STEP_SUMMARY
        else
          echo "2. Test the application at the website URL above" >> $GITHUB_STEP_SUMMARY
          echo "3. Request SES production access if needed" >> $GITHUB_STEP_SUMMARY
        fi