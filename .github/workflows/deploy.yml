name: Deploy Trufo Lambda

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sam/**"
      - "pwa/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: trufo-api

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pwa/package-lock.json

      - name: Build PWA
        run: |
          npm --prefix pwa ci
          npm --prefix pwa run build
          mkdir -p src/pwa_static
          cp -r pwa/dist/* src/pwa_static/

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TrufoDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache SAM build
        uses: actions/cache@v3
        with:
          path: sam/.aws-sam
          key: ${{ runner.os }}-sam-${{ hashFiles('src/**', 'sam/template.yaml') }}
          restore-keys: |
            ${{ runner.os }}-sam-

      - name: Build
        working-directory: sam
        run: sam build

      - name: Deploy
        working-directory: sam
        run: |
          PARAMS="FromEmail=${{ secrets.FROM_EMAIL }} AdminEmail=${{ secrets.ADMIN_EMAIL }}"
          if [ -n "${{ secrets.SES_EMAIL_DOMAIN }}" ]; then
            PARAMS="$PARAMS SESEmailDomain=${{ secrets.SES_EMAIL_DOMAIN }}"
          fi
          if [ -n "${{ secrets.DOMAIN_NAME }}" ]; then
            PARAMS="$PARAMS DomainName=${{ secrets.DOMAIN_NAME }} UseExternalDNS=true"
          fi
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides "$PARAMS" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar \
            2>&1 | grep -E "^\s*(Modify|Add|Delete|UPDATE_|CREATE_|trufo-api|Successfully|No changes|CloudFormation stack changeset)" \
            | grep -v "CLEANUP"

      - name: Deployment summary
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs' \
            --output json)

          get_output() {
            echo "$STACK_OUTPUTS" | python3 -c "
          import sys, json
          outputs = json.load(sys.stdin)
          print(next((o['OutputValue'] for o in outputs if o['OutputKey'] == '$1'), 'N/A'))
          "
          }

          WEBSITE=$(get_output WebsiteURL)
          API=$(get_output ApiGatewayUrl)

          echo "## Trufo deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Website** | $WEBSITE |" >> $GITHUB_STEP_SUMMARY
          echo "| **API** | $API |" >> $GITHUB_STEP_SUMMARY
          echo "| **Create** | ${WEBSITE}create |" >> $GITHUB_STEP_SUMMARY
          echo "| **Manage** | ${WEBSITE}manage |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mobile App (PWA)** | ${WEBSITE}app |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\` by **${{ github.actor }}**" >> $GITHUB_STEP_SUMMARY
