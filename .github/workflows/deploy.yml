name: Deploy Trufo Lambda + S3

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'sam/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: trufo-lambda-s3

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-TrufoDeployment
        aws-region: ${{ env.AWS_REGION }}

    - name: Cache SAM build
      uses: actions/cache@v3
      with:
        path: sam/.aws-sam
        key: ${{ runner.os }}-sam-${{ hashFiles('src/**', 'sam/template.yaml') }}
        restore-keys: |
          ${{ runner.os }}-sam-

    - name: Build Lambda function
      working-directory: sam
      run: sam build

    - name: Deploy to AWS
      working-directory: sam
      run: |
        sam deploy \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --parameter-overrides \
            FromEmail="${{ vars.FROM_EMAIL }}" \
            DomainName="${{ vars.DOMAIN_NAME || '' }}" \
            HostedZoneId="${{ vars.HOSTED_ZONE_ID || '' }}" \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset

    - name: Get deployment info
      id: deployment-info
      run: |
        FUNCTION_URL=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query 'Stacks[0].Outputs[?OutputKey==`WebsiteURL`].OutputValue' \
          --output text)

        BUCKET_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
          --output text)

        echo "function-url=$FUNCTION_URL" >> $GITHUB_OUTPUT
        echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT

    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Stack Name:** ${{ env.STACK_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
        echo "**S3 Bucket:** ${{ steps.deployment-info.outputs.bucket-name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 Access URLs" >> $GITHUB_STEP_SUMMARY
        echo "- **Website:** ${{ steps.deployment-info.outputs.function-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Create Page:** ${{ steps.deployment-info.outputs.function-url }}create" >> $GITHUB_STEP_SUMMARY
        echo "- **Manage Page:** ${{ steps.deployment-info.outputs.function-url }}manage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📡 API Endpoints" >> $GITHUB_STEP_SUMMARY
        echo "- \`POST /api/objects\` - Create object" >> $GITHUB_STEP_SUMMARY
        echo "- \`GET /api/objects\` - Access object" >> $GITHUB_STEP_SUMMARY
        echo "- \`GET /api/user-objects\` - List user objects" >> $GITHUB_STEP_SUMMARY
        echo "- \`DELETE /api/objects\` - Delete object" >> $GITHUB_STEP_SUMMARY
        echo "- \`POST /api/toggle\` - Toggle boolean object" >> $GITHUB_STEP_SUMMARY
        echo "- \`POST /api/validate-email\` - Send email validation" >> $GITHUB_STEP_SUMMARY
        echo "- \`POST /api/verify-code\` - Verify email code" >> $GITHUB_STEP_SUMMARY