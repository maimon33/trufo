name: Deploy Trufo Lambda

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sam/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: trufo-api

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TrufoDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache SAM build
        uses: actions/cache@v3
        with:
          path: sam/.aws-sam
          key: ${{ runner.os }}-sam-${{ hashFiles('src/**', 'sam/template.yaml') }}
          restore-keys: |
            ${{ runner.os }}-sam-

      - name: Build Lambda function
        working-directory: sam
        run: sam build

      - name: Deploy to AWS
        working-directory: sam
        run: |
          PARAMS="FromEmail=${{ secrets.FROM_EMAIL }} AdminEmail=${{ secrets.ADMIN_EMAIL }}"
          if [ -n "${{ secrets.DOMAIN_NAME }}" ]; then
            PARAMS="$PARAMS DomainName=${{ secrets.DOMAIN_NAME }} UseExternalDNS=true"
          fi
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides "$PARAMS" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get deployment info
        id: deployment-info
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs' \
            --output json)

          get_output() {
            echo "$STACK_OUTPUTS" | python3 -c "import sys,json; outputs=json.load(sys.stdin); print(next((o['OutputValue'] for o in outputs if o['OutputKey']=='$1'), ''))"
          }

          echo "website-url=$(get_output WebsiteURL)" >> $GITHUB_OUTPUT
          echo "bucket-name=$(get_output BucketName)" >> $GITHUB_OUTPUT
          echo "dns-target=$(get_output DNSTarget)" >> $GITHUB_OUTPUT
          echo "ssl-validation=$(get_output SSLCertificateValidation)" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack Name:** ${{ env.STACK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ steps.deployment-info.outputs.bucket-name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Website:** ${{ steps.deployment-info.outputs.website-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Create Page:** ${{ steps.deployment-info.outputs.website-url }}create" >> $GITHUB_STEP_SUMMARY
          echo "- **Manage Page:** ${{ steps.deployment-info.outputs.website-url }}manage" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.deployment-info.outputs.dns-target }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### DNS Records to set at your provider" >> $GITHUB_STEP_SUMMARY
            echo "| Type | Name | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| CNAME | ${{ secrets.DOMAIN_NAME }} | ${{ steps.deployment-info.outputs.dns-target }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.deployment-info.outputs.ssl-validation }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📡 API Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/objects\` - Create object" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/objects\` - Access object" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/user-objects\` - List user objects" >> $GITHUB_STEP_SUMMARY
          echo "- \`DELETE /api/objects\` - Delete object" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/toggle\` - Toggle boolean object" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/validate-email\` - Send email validation" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/verify-code\` - Verify email code" >> $GITHUB_STEP_SUMMARY
